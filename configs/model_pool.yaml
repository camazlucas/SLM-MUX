# Pool de modelos de até 10B para os experimentos de multiagentes numa RTX 3090 (24 GB).
# Todos cabem em bf16, um por vez (8B em bf16 ~ 16 GB de pesos; 9,7B ~ 19,3 GB).
# Modelos acima de ~9B deixam pouco espaço para o cache KV: usam gpu_memory_utilization
# maior (campo opcional abaixo) e rodam com menos requisições simultâneas.
#
# revision = commit do modelo no Hugging Face, conferido em 2026-11-16.
# scripts/serve_vllm.sh lê este arquivo e sobe o modelo nessa revisão exata,
# para que a reprodução não mude se o autor atualizar os pesos.
#
# Grupos:
#   paper       -> a dupla usada na Reprodução 1 (SLM-MUX reporta Llama-8B + Qwen-7B no MATH)
#   especialista-> ajustados para um domínio (servem para benchmarks de matemática e código)
#   nova-geracao-> generalistas mais recentes
#   raciocinio  -> geram cadeia de raciocínio longa (mais tokens por resposta)
#   pequeno     -> 3,8-4,7B, para medir o efeito do tamanho
#   teto-10b    -> 8,8-9,7B, entraram quando o teto subiu de 8B para 10B

models:
