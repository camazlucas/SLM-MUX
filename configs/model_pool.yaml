# Pool de modelos de até 10B para os experimentos de multiagentes numa RTX 3090 (24 GB).
# Todos cabem em bf16, um por vez (8B em bf16 ~ 16 GB de pesos; 9,7B ~ 19,3 GB).
# Modelos acima de ~9B deixam pouco espaço para o cache KV: usam gpu_memory_utilization
# maior (campo opcional abaixo) e rodam com menos requisições simultâneas.
#
# Origem da lista (campo `source` em cada modelo):
#   - paper SLM-MUX (Wang et al., ICLR 2026, arXiv 2510.05077): pool de candidatos (Seção 4.3)
#     e modelos especialistas (Apêndices E.1 e E.3)
#   - ToolOrchestra (arXiv 2511.21689): especialista de matemática
#   - comparações de SLMs de 2026, pesquisadas em 2026-11-16:
#       labellerr  = https://www.labellerr.com/blog/best-small-language-models-under-10b-parameters/
#       vdf        = https://vdf.ai/blog/best-small-language-models/
# revision, params_b e license vêm da API do Hugging Face (huggingface.co/api/models/<id>),
# consultada em 2026-11-16. Critérios: cabe numa RTX 3090 em bf16 (até 10B) e cobre
# geração, especialização, raciocínio longo e tamanho.
#
# revision = commit do modelo no Hugging Face, conferido em 2026-11-16.
# scripts/serve_vllm.sh lê este arquivo e sobe o modelo nessa revisão exata,
# para que a reprodução não mude se o autor atualizar os pesos.
#
# Campos opcionais por modelo:
#   hf_id                  -> repositório no Hugging Face, quando o id é uma variante (padrão: o próprio id)
#   chat_template_kwargs   -> repassado ao vLLM em cada requisição (ex.: enable_thinking)
#   max_model_len          -> contexto do servidor (padrão 4096)
#   max_tokens             -> substitui o max_tokens do config da coleta para este modelo
#   gpu_memory_utilization -> fração da VRAM reservada (padrão 0.90)
#
# Grupos:
#   paper       -> a dupla usada na Reprodução 1 (SLM-MUX reporta Llama-8B + Qwen-7B no MATH)
#   especialista-> ajustados para um domínio (servem para benchmarks de matemática e código)
#   nova-geracao-> generalistas mais recentes
#   raciocinio  -> geram cadeia de raciocínio longa (mais tokens por resposta)
#   pequeno     -> 3,8-4,7B, para medir o efeito do tamanho
#   teto-10b    -> 8,8-9,7B, entraram quando o teto subiu de 8B para 10B

models:
  - id: meta-llama/Llama-3.1-8B-Instruct
    revision: 0e9e39f249a16976918f6564b8830bc894c89659
    source: paper SLM-MUX, pool de candidatos (Seção 4.3) e dupla da Tabela 2
    params_b: 8.03
    license: llama3.1
    gated: true          # aceitar a licença na página do modelo antes de baixar
    group: paper
    repro_1: true

  - id: Qwen/Qwen2.5-7B-Instruct
    revision: a09a35458c702b33eeacc393d103063234e8bc28
    source: paper SLM-MUX, pool de candidatos (Seção 4.3) e dupla da Tabela 2
    params_b: 7.62
    license: apache-2.0
    gated: false
    group: paper
    repro_1: true

  - id: Qwen/Qwen2.5-Math-7B-Instruct
    revision: ef9926d75ab1d54532f6a30dd5e760355eb9aa4d
    source: escolha nossa; especialista usado pelo ToolOrchestra (o SLM-MUX usa DeepSeek-Math-7B-RL, Apêndice E.3)
    params_b: 7.62
    license: apache-2.0
    gated: false
    group: especialista
    notes: especialista em matemática (GSM8K, MATH)

  - id: Qwen/Qwen2.5-Coder-7B-Instruct
    revision: c03e6d358207e414f1eca0bb1891e29f1db0e242
    source: paper SLM-MUX, especialista de código (Apêndices E.1 e E.3)
    params_b: 7.62
    license: apache-2.0
    gated: false
    group: especialista
    notes: especialista em código (HumanEval, SWE-bench)

  - id: Qwen/Qwen3-8B
    revision: b968826d9c46dd6066d109eabc6255188de91218
    source: labellerr (2026)
    params_b: 8.19
    license: apache-2.0
    gated: false
    group: nova-geracao
    chat_template_kwargs: {enable_thinking: false}
    notes: raciocínio desligado (enable_thinking=false), para ficar comparável aos outros instruct

  - id: Qwen/Qwen3-8B-thinking
    hf_id: Qwen/Qwen3-8B
    revision: b968826d9c46dd6066d109eabc6255188de91218
    source: variante nossa do Qwen3-8B com raciocínio ligado (model card do Qwen3-8B)
    params_b: 8.19
    license: apache-2.0
    gated: false
    group: raciocinio
    chat_template_kwargs: {enable_thinking: true}
    max_model_len: 32768
    max_tokens: 30000
    gpu_memory_utilization: 0.95
    notes: o model card recomenda até 32.768 tokens de saída e desaconselha greedy; não coletar o greedy desta variante

  - id: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
    revision: 916b56a44061fd5cd7d6a8fb632557ed4f724f60
    source: labellerr (2026)
    params_b: 7.62
    license: mit
    gated: false
    group: raciocinio
    notes: respostas longas; precisa de max_tokens e max-model-len maiores

  - id: microsoft/Phi-4-mini-instruct
